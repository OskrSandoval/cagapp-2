<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CagApp — Mapa (home)</title>
<style>
  /* ============================================================
     CAGAPP 2.0 — MOCK: MAPA (pantalla de inicio, post-login)
     Gobernado por:
     - .memlog.md (change, línea 9): solo se llega aquí DESPUÉS de
       login/registro obligatorio (no hay modo lectura sin cuenta).
     - .memlog.md (decision, línea 10): botón pequeño arriba a la
       derecha para alternar Mapa/Lista — NO barra de navegación
       inferior.
     - .memlog.md (decision, línea 12): ícono de Perfil arriba a
       la izquierda (colocación propuesta / default actual).
     - .memlog.md (decision, línea 13): botón "Agregar Baño" es
       FAB, flotante, abajo sobre la vista de Mapa/Lista.
     - PRD §4.2 FR-4 (mapa centrado en ubicación, pines con
       calificación promedio), FR-5 (alternar a Lista), FR-6
       (tocar un baño abre su Detalle — ver key-detalle-checkin.html).
     - PRD IA: "Mapa (pantalla de inicio) — baños cercanos, permiso
       de ubicación."
     El mapa es un mock estilizado con CSS (sin tiles reales, sin
     imágenes ni llamadas de red) — cuadras/calles simuladas.
     Paleta EXACTA (theme-naranja de color-themes-1.html, ajustada
     tras revisión de accesibilidad WCAG AA — ver notas de contraste):
       bg:#FFFFFF surface:#FFF8F3 primary:#D53C19 primary-ink:#FFFFFF
       text:#2B1B12 muted:#8A6A5A success:#1F7A45 warning:#CB3E48
       border:#F2D9CC
     Nota de accesibilidad (revisión QA):
     - primary #FF5A36 → #D53C19 (mismo tono, más oscuro; ~4.68:1
       contra blanco); el rgba del glow del FAB se actualizó al
       mismo RGB (213,60,25).
     - success #2E9E5B → #1F7A45 (~4.71:1 contra success-surface).
     - warning #D64550 → #CB3E48 (~4.86:1 contra blanco).
     - Ícono de perfil con aria-label="Perfil".
     - Badge del pin de mapa con área táctil invisible ampliada
       (~24×24px) sin cambiar el tamaño visual de la píldora.
     ============================================================ */

  :root{
    --bg:#FFFFFF; --surface:#FFF8F3; --primary:#D53C19; --primary-ink:#FFFFFF;
    --text:#2B1B12; --muted:#8A6A5A; --success:#1F7A45; --warning:#CB3E48; --border:#F2D9CC;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:#EDEDED;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding:24px 16px 48px;
    display:flex;
    justify-content:center;
  }

  .wrap{ display:flex; flex-direction:column; align-items:center; width:100%; max-width:375px; }
  .caption{ font-size:12.5px; color:#555; text-align:center; margin:0 0 14px; }

  .device{
    width:100%;
    background:#151515;
    border-radius:42px;
    padding:12px;
    box-shadow:0 24px 50px rgba(0,0,0,.28);
  }
  .screen{
    background:var(--bg);
    border-radius:30px;
    overflow:hidden;
    min-height:700px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px 4px;
    font-size:12px;
    font-weight:600;
    color:var(--text);
    background:var(--bg);
    position:relative;
    z-index:5;
  }
  .statusbar .icons{ letter-spacing:2px; }

  /* ---------- Top bar: perfil (izq) + toggle mapa/lista (der) ---------- */
  .topbar{
    position:absolute;
    top:44px;
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 14px;
    z-index:10;
    pointer-events:none;
  }
  .profile-btn{
    pointer-events:auto;
    width:42px; height:42px;
    border-radius:50%;
    background:var(--bg);
    border:1px solid var(--border);
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
  }
  .toggle-btn{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--bg);
    border:1px solid var(--border);
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    border-radius:999px;
    padding:9px 14px;
    font-size:12.5px;
    font-weight:700;
    color:var(--text);
  }
  .toggle-btn .dot{ color:var(--primary); }

  /* ---------- Mock map ---------- */
  .map{
    flex:1;
    position:relative;
    background:
      repeating-linear-gradient(0deg, #E7EFE2 0 64px, #DCE7D5 64px 68px),
      repeating-linear-gradient(90deg, transparent 0 78px, rgba(139,106,90,.18) 78px 80px);
    overflow:hidden;
  }
  .block{
    position:absolute;
    background:#F1EADF;
    border:1px solid #E1D7C6;
    border-radius:4px;
  }
  .street-label{
    position:absolute;
    font-size:9px;
    color:#8A6A5A;
    background:rgba(255,255,255,.7);
    padding:1px 5px;
    border-radius:4px;
    font-weight:600;
    letter-spacing:.02em;
  }

  .me-dot{
    position:absolute;
    width:16px; height:16px;
    border-radius:50%;
    background:#3B82F6;
    border:3px solid #fff;
    box-shadow:0 0 0 6px rgba(59,130,246,.25);
  }

  .pin{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    transform:translate(-50%, -100%);
  }
  .pin .badge{
    position:relative;
    padding:3px 9px;
    border-radius:999px 999px 999px 2px;
    color:#fff;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
  }
  /* Área táctil ampliada (invisible): la píldora visual conserva su
     tamaño original (~19px de alto); este pseudo-elemento transparente
     extiende el hit area a ~24-25px sin alterar el aspecto del pin. */
  .pin .badge::before{
    content:"";
    position:absolute;
    top:-3px; right:-3px; bottom:-3px; left:-3px;
  }
  .pin .stem{
    width:2px; height:8px;
    background:currentColor;
  }
  .pin.good .badge{ background:var(--success); }
  .pin.mid .badge{ background:var(--primary); }
  .pin.bad .badge{ background:var(--warning); }

  .zone-empty-hint{
    position:absolute;
    bottom:96px;
    left:14px; right:14px;
    background:rgba(255,255,255,.92);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px 12px;
    font-size:11px;
    color:var(--muted);
    text-align:center;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--primary);
    color:var(--primary-ink);
    border:none;
    border-radius:999px;
    padding:14px 22px;
    font-size:14.5px;
    font-weight:800;
    box-shadow:0 10px 22px rgba(213,60,25,.45);
    z-index:10;
  }
</style>
</head>
<body>

  <div class="wrap">
    <p class="caption">🖼️ Mock 2/3 — Mapa (home tras login), toggle Mapa/Lista, Perfil, FAB</p>

    <div class="device">
      <div class="screen">

        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">••• 📶 🔋</span>
        </div>

        <div class="topbar">
          <div class="profile-btn" role="button" aria-label="Perfil">👤</div>
          <div class="toggle-btn"><span class="dot">☰</span> Ver lista</div>
        </div>

        <div class="map">
          <div class="block" style="top:40px; left:20px; width:70px; height:90px;"></div>
          <div class="block" style="top:40px; left:110px; width:90px; height:60px;"></div>
          <div class="block" style="top:140px; left:20px; width:120px; height:70px;"></div>
          <div class="block" style="top:230px; left:150px; width:80px; height:100px;"></div>
          <div class="block" style="top:340px; left:30px; width:100px; height:80px;"></div>
          <div class="block" style="top:440px; left:160px; width:90px; height:70px;"></div>
          <div class="block" style="top:540px; left:20px; width:110px; height:90px;"></div>

          <div class="street-label" style="top:210px; left:14px;">Av. Álvaro Obregón</div>
          <div class="street-label" style="top:420px; left:150px;">Calle Orizaba</div>

          <div class="me-dot" style="top:300px; left:170px;"></div>

          <div class="pin good" style="top:200px; left:120px;">
            <div class="badge">🚽 4.5★</div>
            <div class="stem" style="color:var(--success);"></div>
          </div>

          <div class="pin mid" style="top:380px; left:80px;">
            <div class="badge">🚽 3.5★</div>
            <div class="stem" style="color:var(--primary);"></div>
          </div>

          <div class="pin good" style="top:470px; left:220px;">
            <div class="badge">🚽 5.0★</div>
            <div class="stem" style="color:var(--success);"></div>
          </div>

          <div class="pin bad" style="top:150px; left:250px;">
            <div class="badge">🚽 2.0★</div>
            <div class="stem" style="color:var(--warning);"></div>
          </div>

          <div class="pin mid" style="top:580px; left:200px;">
            <div class="badge">🚽 4.0★</div>
            <div class="stem" style="color:var(--primary);"></div>
          </div>

          <button class="fab">➕ Agregar Baño</button>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
